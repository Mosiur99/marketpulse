services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
      POSTGRES_DB: marketpulse
    command: ["postgres", "-c", "shared_buffers=128MB"]
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
